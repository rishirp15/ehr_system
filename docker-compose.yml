services:
  frontend:
    image: nginx:alpine
    container_name: frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ehr-net

  redis:
    image: "redis:alpine"
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - ehr-net

  api-gateway:
    build: ./services
    container_name: api-gateway
    command: python api_gateway.py
    ports:
      - "5000:5000"
    networks:
      - ehr-net
    depends_on:
      app-node-1:
        condition: service_started
      app-node-2:
        condition: service_started
      app-node-3:
        condition: service_started

  app-node-1:
    build: ./services
    container_name: app-node-1
    command: python app_node.py 6001
    ports:
      - "6001:6001"
    networks:
      - ehr-net
    depends_on:
      redis:
        condition: service_started
      data-node-1:
        condition: service_healthy
      data-node-2:
        condition: service_healthy
      data-node-3:
        condition: service_healthy

  app-node-2:
    build: ./services
    container_name: app-node-2
    command: python app_node.py 6002
    ports:
      - "6002:6002"
    networks:
      - ehr-net
    depends_on:
      redis:
        condition: service_started
      data-node-1:
        condition: service_healthy
      data-node-2:
        condition: service_healthy
      data-node-3:
        condition: service_healthy

  app-node-3:
    build: ./services
    container_name: app-node-3
    command: python app_node.py 6003
    ports:
      - "6003:6003"
    networks:
      - ehr-net
    depends_on:
      redis:
        condition: service_started
      data-node-1:
        condition: service_healthy
      data-node-2:
        condition: service_healthy
      data-node-3:
        condition: service_healthy

  data-node-1:
    build: ./services
    container_name: data-node-1
    command: python data_node.py 7001 data_node_1.db
    volumes:
      - ./data/node1:/data
    networks:
      - ehr-net
    healthcheck:
      test: ["CMD", "python", "-c", "import xmlrpc.client; proxy = xmlrpc.client.ServerProxy('http://localhost:7001'); proxy.dispatch_rpc('ping', {})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  data-node-2:
    build: ./services
    container_name: data-node-2
    command: python data_node.py 7002 data_node_2.db
    volumes:
      - ./data/node2:/data
    networks:
      - ehr-net
    healthcheck:
      test: ["CMD", "python", "-c", "import xmlrpc.client; proxy = xmlrpc.client.ServerProxy('http://localhost:7002'); proxy.dispatch_rpc('ping', {})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  data-node-3:
    build: ./services
    container_name: data-node-3
    command: python data_node.py 7003 data_node_3.db
    volumes:
      - ./data/node3:/data
    networks:
      - ehr-net
    healthcheck:
      test: ["CMD", "python", "-c", "import xmlrpc.client; proxy = xmlrpc.client.ServerProxy('http://localhost:7003'); proxy.dispatch_rpc('ping', {})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  ehr-net:
    driver: bridge