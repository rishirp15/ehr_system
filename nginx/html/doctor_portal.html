<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSync Pro - Clinical Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass-effect { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .pulse-animation { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .form-input {
            color-scheme: dark;
            @apply w-full px-4 py-3 border border-slate-600 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent sm:text-sm transition-all bg-slate-800/50 text-white;
        }
        .btn-primary { @apply inline-flex items-center justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all disabled:bg-blue-800; }
        .card { @apply bg-slate-800/50 p-6 rounded-xl shadow-lg border border-slate-700; }
        .toast { position: fixed; top: 20px; right: 20px; padding: 1rem 1.5rem; border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); opacity: 0; transform: translateY(-20px); transition: opacity 0.3s ease, transform 0.3s ease; z-index: 50; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .loader { border: 4px solid #1e40af; border-top: 4px solid #60a5fa; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .record-card { background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(51, 65, 85, 0.7) 100%); border: 1px solid #475569; transition: all 0.3s ease; }
        .record-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); border-color: #3b82f6; }
        /* Modal styles */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { transform: scale(0.95); transition: transform 0.3s ease; }
        .modal-overlay.active .modal-content { transform: scale(1); }
    </style>
</head>
<body class="h-full text-white">

    <div id="audit-log-modal" class="modal-overlay">
        <div class="modal-content card max-w-2xl w-full">
            <div class="flex justify-between items-center mb-4"><h2 class="text-xl font-bold text-white">Record Access History</h2><button onclick="closeAuditModal()" class="text-slate-400 hover:text-white text-2xl font-bold">&times;</button></div>
            <div id="audit-log-content" class="max-h-[60vh] overflow-y-auto text-sm space-y-2"></div>
        </div>
    </div>

    <div class="min-h-screen">
        <header class="border-b border-slate-700 bg-slate-800/50 backdrop-blur-sm sticky top-0 z-10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"><div class="flex justify-between items-center py-4"><div class="flex items-center space-x-4"><div class="w-10 h-10 bg-gradient-to-r from-emerald-500 to-teal-600 rounded-lg flex items-center justify-center"><svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></div><div><h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text text-transparent">Clinical Workspace</h1><p class="text-sm text-slate-400">Advanced Patient Record Management</p></div></div><div class="flex items-center space-x-4"><div class="flex items-center space-x-2"><div class="w-2 h-2 bg-green-400 rounded-full pulse-animation"></div><span class="text-sm text-slate-300">System Online</span></div><div class="text-sm text-slate-400 mono"><span id="current-time"></span></div></div></div></div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="card">
                <div class="border-b border-slate-600 mb-6">
                    <nav class="-mb-px flex space-x-8" aria-label="Tabs">
                        <button id="add-record-tab-button" class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm text-emerald-400 border-emerald-400">Submit New Record</button>
                        <button id="view-records-tab-button" class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm text-slate-400 hover:text-slate-300 hover:border-slate-300 border-transparent">Query Patient Records</button>
                    </nav>
                </div>
                <div id="add-record-container">
                    <form id="add-record-form" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div><label for="patient-uuid" class="block text-sm font-medium text-slate-300 mb-2">Patient Identifier (UUID)</label><input id="patient-uuid" name="patient_uuid" type="text" required class="form-input mono" placeholder="Enter patient's unique identifier"></div>
                        <div><label for="doctor-name" class="block text-sm font-medium text-slate-300 mb-2">Attending Physician</label><input id="doctor-name" name="doctor_name" type="text" required class="form-input" placeholder="Dr. Evelyn Reed"></div>
                        <div class="sm:col-span-2"><label for="description" class="block text-sm font-medium text-slate-300 mb-2">Clinical Notes / Diagnosis</label><textarea id="description" name="description" rows="3" required class="form-input" placeholder="Detailed diagnosis and clinical findings..."></textarea></div>
                        <div class="sm:col-span-2"><label for="prescription" class="block text-sm font-medium text-slate-300 mb-2">Prescription & Treatment Plan</label><textarea id="prescription" name="prescription" rows="3" required class="form-input" placeholder="Prescribed medications and treatment plan..."></textarea></div>
                        <div class="sm:col-span-2"><label for="resources-used" class="block text-sm font-medium text-slate-300 mb-2">Resources Utilized</label><input id="resources-used" name="resources_used" type="text" placeholder="X-Ray, Blood Test, MRI, etc." class="form-input"></div>
                        <div class="sm:col-span-2"><button id="add-record-btn" type="submit" class="btn-primary w-auto"><span class="btn-text">Create Medical Record</span><div class="loader hidden"></div></button></div>
                    </form>
                </div>
                <div id="view-records-container" class="hidden">
                    <form id="view-records-form" class="space-y-4 mb-6">
                        <div><label for="view-patient-uuid" class="block text-sm font-medium text-slate-300 mb-2">Patient Identifier (UUID)</label><input id="view-patient-uuid" type="text" required class="form-input mono" placeholder="Enter patient's unique identifier"></div>
                        <div><label for="view-doctor-name" class="block text-sm font-medium text-slate-300 mb-2">Your Name (for Audit Trail)</label><input id="view-doctor-name" type="text" required class="form-input" placeholder="e.g., Dr. Evelyn Reed"></div>
                        <div><button id="fetch-records-btn" type="submit" class="btn-primary w-auto"><span class="btn-text">Retrieve Records</span><div class="loader hidden"></div></button></div>
                    </form>
                </div>
            </div>
            <div id="results-container" class="mt-8 hidden">
                <div class="card">
                    <h2 id="records-title" class="text-xl font-bold text-white mb-6">Patient Medical Records</h2>
                    <div id="records-display-message" class="text-center text-slate-500 py-16"></div>
                    <div id="records-list" class="space-y-4"></div>
                </div>
            </div>
        </main>
    </div>
    <div id="toast-notification" class="toast"></div>
    <script>
        const API_URL = 'http://localhost:5000';
        let currentPatientUUID = null;
        const addRecordTabButton = document.getElementById('add-record-tab-button'), viewRecordsTabButton = document.getElementById('view-records-tab-button');
        const addRecordContainer = document.getElementById('add-record-container'), viewRecordsContainer = document.getElementById('view-records-container');
        const addRecordForm = document.getElementById('add-record-form'), viewRecordsForm = document.getElementById('view-records-form');
        const addRecordBtn = document.getElementById('add-record-btn'), fetchRecordsBtn = document.getElementById('fetch-records-btn');
        const resultsContainer = document.getElementById('results-container'), recordsTitle = document.getElementById('records-title');
        const recordsDisplayMessage = document.getElementById('records-display-message'), recordsDisplayList = document.getElementById('records-list');
        const toastNotification = document.getElementById('toast-notification');
        const auditLogModal = document.getElementById('audit-log-modal'), auditLogContent = document.getElementById('audit-log-content');
        addRecordTabButton.addEventListener('click', () => switchTab('add'));
        viewRecordsTabButton.addEventListener('click', () => switchTab('view'));
        addRecordForm.addEventListener('submit', handleAddRecord);
        viewRecordsForm.addEventListener('submit', handleViewRecords);
        function switchTab(tab) {
            const activeClasses = ['text-emerald-400', 'border-emerald-400'];
            const inactiveClasses = ['text-slate-400', 'hover:text-slate-300', 'hover:border-slate-300', 'border-transparent'];
            [addRecordTabButton, viewRecordsTabButton].forEach(t => { t.classList.remove(...activeClasses); t.classList.add(...inactiveClasses); });
            if (tab === 'add') {
                addRecordTabButton.classList.remove(...inactiveClasses); addRecordTabButton.classList.add(...activeClasses);
                addRecordContainer.classList.remove('hidden'); viewRecordsContainer.classList.add('hidden');
                resultsContainer.classList.add('hidden');
            } else {
                viewRecordsTabButton.classList.remove(...inactiveClasses); viewRecordsTabButton.classList.add(...activeClasses);
                viewRecordsContainer.classList.remove('hidden'); addRecordContainer.classList.add('hidden');
            }
        }
        async function handleAddRecord(e) { e.preventDefault(); toggleButtonLoading(addRecordBtn, true); const formData = new FormData(addRecordForm); const payload = Object.fromEntries(formData.entries()); try { const response = await fetch(`${API_URL}/record`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); const data = await response.json(); if (response.ok && data.status === 'success') { showToast('✅ Medical record created successfully!', 'success'); addRecordForm.reset(); if (payload.patient_uuid === currentPatientUUID) await handleViewRecords(e, payload.patient_uuid); } else { showToast(`Error: ${data.error || data.message}`, 'error'); } } catch (error) { showToast('Error: Could not connect to the server.', 'error'); } finally { toggleButtonLoading(addRecordBtn, false); } }
        async function handleViewRecords(e, uuid = null) { if (e) e.preventDefault(); toggleButtonLoading(fetchRecordsBtn, true); const patientUUID = uuid || document.getElementById('view-patient-uuid').value; const accessorId = document.getElementById('doctor-name').value || 'Clinician'; resultsContainer.classList.remove('hidden'); recordsDisplayMessage.innerHTML = `<div class="loader mx-auto mt-16 border-t-blue-500"></div><p class="mt-4 text-slate-400">Retrieving patient records...</p>`; recordsDisplayList.innerHTML = ''; try { const response = await fetch(`${API_URL}/records/${patientUUID}?accessor_id=${encodeURIComponent(accessorId)}`); if (response.ok) { const records = await response.json(); currentPatientUUID = patientUUID; renderRecords(records, patientUUID); document.getElementById('patient-uuid').value = patientUUID; } else { const errorData = await response.json(); renderRecords([], patientUUID, `Error: ${errorData.error}`); } } catch (error) { renderRecords([], patientUUID, `Error: Could not connect to the server.`); } finally { toggleButtonLoading(fetchRecordsBtn, false); } }
        async function showAuditModal(recordId) { auditLogContent.innerHTML = `<div class="loader mx-auto"></div>`; auditLogModal.classList.add('active'); try { const response = await fetch(`${API_URL}/audit/${recordId}`); if (response.ok) { const logs = await response.json(); if (logs.length === 0) { auditLogContent.innerHTML = '<p class="text-slate-400">No access history found for this record.</p>'; } else { auditLogContent.innerHTML = logs.map(log => `<div class="p-3 border-b border-slate-700 last:border-b-0"><p class="font-semibold text-slate-300">${log.action} by <span class="text-teal-400">${log.accessor_id}</span></p><p class="text-xs text-slate-500 mono">${new Date(log.timestamp * 1000).toLocaleString()}</p></div>`).join(''); } } else { auditLogContent.innerHTML = '<p class="text-red-400">Could not load audit history.</p>'; } } catch (e) { auditLogContent.innerHTML = '<p class="text-red-400">Server connection error while loading audit history.</p>'; } }
        function closeAuditModal() { auditLogModal.classList.remove('active'); }
        function renderRecords(records, uuid, error = null) { recordsTitle.innerHTML = `Medical Records for <span class="font-mono text-emerald-400">${uuid.substring(0, 8)}...</span>`; recordsDisplayList.innerHTML = ''; recordsDisplayMessage.innerHTML = ''; if (error) { recordsDisplayMessage.innerHTML = `<div class="text-center text-red-400 py-8"><p>${error}</p></div>`; return; } if (records.length === 0) { recordsDisplayMessage.innerHTML = `<div class="text-center text-slate-400 py-8"><svg class="w-16 h-16 mx-auto mb-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg><p class="text-lg font-medium">No records found</p></div>`; return; } recordsDisplayList.innerHTML = records.map(rec => `<div class="record-card rounded-lg p-6"><div class="flex justify-between items-start mb-4"><div><h3 class="font-bold text-white text-lg">Dr. ${rec.doctor_name}</h3><p class="text-xs text-slate-500 font-mono mt-1">ID: ${rec.record_id}</p></div><p class="text-xs text-slate-400 whitespace-nowrap ml-4 mono">${new Date(rec.timestamp * 1000).toLocaleString()}</p></div><div class="space-y-3 text-sm border-t border-slate-700 pt-4 mt-4"><p><strong class="text-slate-300">Diagnosis:</strong> <span class="text-slate-400">${rec.description}</span></p><p><strong class="text-slate-300">Prescription:</strong> <span class="text-slate-400">${rec.prescription}</span></p></div><div class="mt-4 border-t border-slate-700 pt-3"><button onclick="showAuditModal('${rec.record_id}')" class="text-xs font-semibold text-blue-400 hover:text-blue-300">View Access History</button></div></div>`).join(''); }
        function toggleButtonLoading(button, isLoading) { const btnText = button.querySelector('.btn-text'); const loader = button.querySelector('.loader'); if (isLoading) { button.disabled = true; btnText.classList.add('hidden'); loader.classList.remove('hidden'); } else { button.disabled = false; btnText.classList.remove('hidden'); loader.classList.add('hidden'); } }
        function showToast(message, type = 'info') { const bgColor = type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-green-600' : 'bg-blue-600'; toastNotification.textContent = message; toastNotification.className = `toast show ${bgColor} text-white`; setTimeout(() => toastNotification.classList.remove('show'), 3000); }
        function updateTime() { document.getElementById('current-time').textContent = new Date().toLocaleTimeString(); }
        document.addEventListener('DOMContentLoaded', () => { updateTime(); setInterval(updateTime, 1000); });
    </script>
</body>
</html>
